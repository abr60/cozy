general {
    lock_cmd = system-lock
    before_sleep_cmd = LOCK_ONLY=true system-lock && sleep 1
    after_sleep_cmd = sleep 1; system-wake; /usr/local/bin/bat-screentime-hook screen-on; /usr/local/bin/bat-screentime-hook idle-end
    inhibit_sleep = 5
}

# Mark "idle but screen still on" (for active-vs-idle usage stats)
listener {
    timeout = 120
    on-timeout = /usr/local/bin/bat-screentime-hook idle-start
    on-resume = /usr/local/bin/bat-screentime-hook idle-end
}

# Lock system after 5 minutes; also track display-off for screen-on time
listener {
    timeout = 300
    on-timeout = /usr/local/bin/bat-screentime-hook screen-off; system-lock
    on-resume = system-wake; /usr/local/bin/bat-screentime-hook screen-on
}
